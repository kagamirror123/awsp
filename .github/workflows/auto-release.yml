# Dependabot の更新が main に入っていたら patch を上げてリリースする(D26)
#
# push トリガーにしない理由: Dependabot の PR は GITHUB_TOKEN で予約した auto-merge で
# マージされ、GITHUB_TOKEN 起点のイベントはワークフローを起動しない(v0.11.0 直後の #15 で実測)。
# そのため定期実行で main の HEAD を見に行き、未タグかつ author が dependabot なら処理する。
#
# GITHUB_TOKEN で push したタグも release.yml の tag トリガーを起動しないため、
# タグ作成に続けて release.yml を reusable workflow として同じ実行内で呼ぶ。
name: Auto Release

on:
  schedule:
    # 平日 10:00〜18:00 JST に毎時(Dependabot は月曜 09:00 JST に PR を出す)
    - cron: "0 1-9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    name: Tag next patch
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Compute and push next patch tag
        id: bump
        run: |
          set -euo pipefail
          if git describe --tags --exact-match HEAD >/dev/null 2>&1; then
            echo "HEAD は既にタグ付き。何もしない"
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          author="$(git log -1 --format=%an)"
          if [ "$author" != "dependabot[bot]" ]; then
            echo "HEAD の author は $author。人間の変更は task release-tag で出すので何もしない"
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # HEAD から辿れるタグ(git describe)ではなく 全タグの最大版を起点にする。
          # v0.11.0 / v0.11.1 が作業ブランチのコミットに付いていて main から辿れないため。
          latest="$(git tag -l 'v[0-9]*' | sort -V | tail -n 1)"
          latest="${latest:-v0.0.0}"
          IFS=. read -r major minor patch <<<"${latest#v}"
          next="v${major}.${minor}.$((patch + 1))"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$next" -m "Release $next"
          git push origin "$next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "tagged $next (previous: $latest)"

  release:
    name: Release
    needs: tag
    if: needs.tag.outputs.tag != ''
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
    # HOMEBREW_TAP_GITHUB_TOKEN を呼び先へ渡す(D28)
    secrets: inherit
