# Dependabot の更新が main に入ったら patch を上げてリリースする(D26)
# GITHUB_TOKEN で push したタグは release.yml の tag トリガーを起動しないため
# タグ作成に続けて release.yml を reusable workflow として同じ実行内で呼ぶ
name: Auto Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  tag:
    name: Tag next patch
    runs-on: ubuntu-latest
    if: github.event.head_commit.author.username == 'dependabot[bot]' || startsWith(github.event.head_commit.message, 'chore(deps)')
    outputs:
      tag: ${{ steps.bump.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute and push next patch tag
        id: bump
        run: |
          set -euo pipefail
          latest="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo v0.0.0)"
          IFS=. read -r major minor patch <<<"${latest#v}"
          next="v${major}.${minor}.$((patch + 1))"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$next" -m "Release $next"
          git push origin "$next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "tagged $next (previous: $latest)"

  release:
    name: Release
    needs: tag
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
    # HOMEBREW_TAP_GITHUB_TOKEN を呼び先へ渡す(D28)
    secrets: inherit
