# Dependabot の PR に auto-merge を予約する(D26)
# 実際のマージは main のルールセットが要求する "CI / Lint and Test" が通った時点で GitHub が行う
# リポジトリ設定の "Allow auto-merge" が有効であることが前提
name: Dependabot auto-merge

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: Enable auto-merge
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'kagamirror123/awsp'

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Go モジュールのメジャー更新は API 互換が壊れ得るので人が見る。それ以外は CI が通れば squash でマージする
      - name: Enable auto-merge
        if: steps.metadata.outputs.package-ecosystem != 'go_modules' || steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
