version: 2

project_name: awsp

before:
  hooks:
    - go mod tidy
    - go test ./...
    - go vet ./...

builds:
  - id: awsp
    binary: awsp
    main: ./main.go
    env:
      - CGO_ENABLED=0
    # Windows はビルド対象外(D25): ブラウザ自動起動とシェル連携が無く 検証環境も無い
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: package
    ids:
      - awsp
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
  - id: raw
    ids:
      - awsp
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - binary

# SBOM(D27): アーカイブごとに syft で SPDX JSON を生成し Release に添付する
sboms:
  - artifacts: archive

# Homebrew tap(D28): kagamirror123/homebrew-tap に cask を生成して push する
# 旧来の brews(formula)は goreleaser v2.10 以降非推奨で バイナリ配布は cask が推奨
homebrew_casks:
  - name: awsp
    ids:
      - package
    repository:
      owner: kagamirror123
      name: homebrew-tap
      # GITHUB_TOKEN は awsp リポジトリにしか届かないため tap 用の fine-grained PAT を使う
      # token は goreleaser が `{{ .Env.X }}` 単独の形しか受け付けない(関数や条件は書けない)
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    # PAT が未設定(ローカルの snapshot)か空(Secrets 未登録)なら cask の生成だけ行い push しない
    # and は短絡評価なので 未設定のときに .Env.X の missingkey エラーにはならない
    skip_upload: '{{ if and (isEnvSet "HOMEBREW_TAP_GITHUB_TOKEN") .Env.HOMEBREW_TAP_GITHUB_TOKEN }}false{{ else }}true{{ end }}'
    homepage: https://github.com/kagamirror123/awsp
    description: AWS profile switcher with SSO status, PKCE login and an MCP server for AI agents
    license: MIT
    binaries:
      - awsp
    caveats: |
      シェル連携を設定すると awsp <profile> が親シェルに反映されます:
        zsh : echo 'eval "$(awsp init zsh)"' >> ~/.zshrc
        bash: echo 'eval "$(awsp init bash)"' >> ~/.bashrc
        fish: echo 'awsp init fish | source' >> ~/.config/fish/config.fish
    hooks:
      post:
        # バイナリは署名していないため Gatekeeper の quarantine 属性を外す(goreleaser 推奨の書き方)
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/awsp"]
          end

checksum:
  name_template: checksums.txt

release:
  github:
    owner: kagamirror123
    name: awsp
  prerelease: auto

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
