version: 2

project_name: awsp

before:
  hooks:
    - go mod tidy
    - go test ./...
    - go vet ./...

builds:
  - id: awsp
    binary: awsp
    main: ./main.go
    env:
      - CGO_ENABLED=0
    # Windows はビルド対象外(D25): ブラウザ自動起動とシェル連携が無く 検証環境も無い
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: package
    ids:
      - awsp
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
  - id: raw
    ids:
      - awsp
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - binary

# SBOM(D27): アーカイブごとに syft で SPDX JSON を生成し Release に添付する
sboms:
  - artifacts: archive

checksum:
  name_template: checksums.txt

release:
  github:
    owner: kagamirror123
    name: awsp
  prerelease: auto

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
